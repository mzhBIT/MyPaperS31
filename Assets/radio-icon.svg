<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" shape-rendering="crispEdges">
  <rect width="100" height="100" fill="#fff"/>

  <!-- Antenna -->
  <rect x="68" y="12" width="4" height="28" fill="#000"/>

  <!-- Handle -->
  <rect x="24" y="24" width="44" height="4" fill="#000"/>
  <rect x="20" y="28" width="4" height="12" fill="#000"/>
  <rect x="68" y="28" width="4" height="12" fill="#000"/>

  <!-- Radio body -->
  <rect x="12" y="36" width="76" height="48" fill="#000"/>
  <rect x="16" y="40" width="68" height="40" fill="#fff"/>
  <rect x="20" y="44" width="60" height="32" fill="#000"/>

  <!-- Speaker grille -->
  <rect x="24" y="48" width="4" height="24" fill="#fff"/>
  <rect x="32" y="48" width="4" height="24" fill="#fff"/>
  <rect x="40" y="48" width="4" height="24" fill="#fff"/>
  <rect x="48" y="48" width="4" height="24" fill="#fff"/>

  <!-- Tuning panel -->
  <rect x="60" y="48" width="16" height="8" fill="#fff"/>
  <rect x="60" y="60" width="16" height="4" fill="#fff"/>
  <rect x="64" y="68" width="8" height="4" fill="#fff"/>

  <!-- Feet -->
