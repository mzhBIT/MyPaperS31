dependencies:
  espressif/esp_audio_render:
    matches:
    - if: $CONFIG{ESP_PLAYER_ENABLE_AUDIO} == True
    version: ^0.8
  espressif/esp_extractor:
    require: public
    version: ~1.0
  espressif/esp_hls_stream:
    matches:
    - if: $CONFIG{ESP_PLAYER_ENABLE_HLS_IO} == True
    require: public
    version: ^1.0
  espressif/esp_video_codec:
    matches:
    - if: $CONFIG{ESP_PLAYER_ENABLE_VIDEO} == True
    version: ^0.5
  espressif/esp_video_render:
    matches:
    - if: $CONFIG{ESP_PLAYER_ENABLE_VIDEO} == True
    version: ^0.8
  espressif/gmf_audio:
    matches:
    - if: $CONFIG{ESP_PLAYER_ENABLE_AUDIO} == True
    require: public
    version: ^0.8
  espressif/gmf_core:
    require: public
    version: ^0.8
  espressif/gmf_io:
    require: public
    version: ^0.8
  espressif/gmf_video:
    matches:
    - if: $CONFIG{ESP_PLAYER_ENABLE_VIDEO} == True
    require: public
    version: ^0.8
description: Espressif Player is a module for embedded multimedia playback with demux,
  decode, and audio/video render
documentation: https://github.com/espressif/esp-gmf/blob/main/packages/esp_player/README.md
issues: https://github.com/espressif/esp-gmf/issues
repository: git://github.com/espressif/esp-gmf.git
repository_info:
  commit_sha: 24a274175ee470187336c3db9b63381df16c8fcb
  path: ./packages/esp_player
tags:
- gmf
- multimedia
- player
- esp_player
- audio_player
- video_player
url: https://github.com/espressif/esp-gmf/tree/main/packages/esp_player
version: 1.0.0
